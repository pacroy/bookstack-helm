name: Sync Files

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SOURCE_REPO: pacroy/gh-common-workflows

permissions:
  contents: read

jobs:
  sync:
    name: Sync Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SYNC_PAT }}
          path: "target"
          ref: ${{ github.head_ref }}
      - name: Checkout Source
        uses: actions/checkout@v7
        if: ${{ github.repository != env.SOURCE_REPO }}
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SYNC_PAT }}
          path: "source"
      - name: Checkout Source
        uses: actions/checkout@v7
        if: ${{ github.repository == env.SOURCE_REPO }}
        with:
          token: ${{ secrets.SYNC_PAT }}
          ref: ${{ github.head_ref }}
          path: "source"
      - name: Print files and directories
        shell: bash
        run: tree -aI "\.git" "$(pwd)"
      - name: Sync files
        shell: bash
        run: |
          cd source

          rsync --archive --relative \
            ".github/workflows/sync.yml" \
            ".github/workflows/mdlink.yml" \
            ".github/workflows/linter.yml" \
            ".github/mdlink/" \
            "../target/"

      - name: Create Job Summary
        shell: bash
        run: |
          {
            cd target
            git add .
            synced_files="$(git status --porcelain)"

            if [ -z "${synced_files}" ]; then
              echo ":smile: No change detected. Everything is already in sync."
            else
              echo ":sunglasses: The following changes have been made:"
              echo "\`\`\`console"
              echo "${synced_files}"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and push
        shell: bash
        run: |
          cd target
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          if git commit -m "[AUTO] Sync files"; then
            git push
          fi
