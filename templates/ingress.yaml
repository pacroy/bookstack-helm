apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.allow-http: {{ .Values.allowHttp | default "false" | quote }}
    {{- if hasKey .Values "ingress" }}
    {{- if and (hasKey .Values.ingress "certManager") .Values.ingress.certManager .Values.ingress.certManager.enabled }}
    {{- if eq (.Values.ingress.certManager.issuerType | default "cluster-issuer") "cluster-issuer" }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManager.issuerName | default "letsencrypt-prod" }}
    {{- else if eq .Values.ingress.certManager.issuerType "issuer" }}
    cert-manager.io/issuer: {{ .Values.ingress.certManager.issuerName | default "letsencrypt-prod" }}
    {{- end }}
    {{- end }}
    {{- else }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    {{- if hasKey .Values "ingress" }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  name: {{ printf "%s-%s" .Release.Name "bookstack" }}
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.appHost }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
              name: {{ printf "%s-%s" .Release.Name "bookstack" }}
              port:
                number: 8080
        
  tls:
  - hosts:
    - {{ .Values.appHost }}
    {{- if and (hasKey .Values "ingress") (hasKey .Values.ingress "tls") .Values.ingress.tls .Values.ingress.tls.secretName }}
    secretName: {{ .Values.ingress.tls.secretName }}
    {{- else }}
    secretName: {{ printf "%s-%s" .Release.Name "bookstack" }}
    {{- end }}